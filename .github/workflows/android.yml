name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Download verified Tanzil Uthmani Quran text
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/data/quran-uthmani.txt \
            -o app/src/main/assets/quran-uthmani.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("app/src/main/assets/quran-uthmani.txt")
          data = p.read_bytes()
          git_blob_sha = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\x00" + data).hexdigest()
          expected = "f2f03c415ea50f8493d2058ec67a90257333abe3"
          if git_blob_sha != expected:
              raise SystemExit(f"Quran source integrity check failed: {git_blob_sha}")
          print(f"Verified Tanzil Uthmani text: {len(data)} bytes")
          PY
          cat > app/src/main/assets/TANZIL-LICENSE.txt <<'EOF'
          Tanzil Quran Text (Uthmani, Version 1.1)
          Copyright (C) 2007-2024 Tanzil Project
          License: Creative Commons Attribution 3.0

          This copy of the Quran text is carefully produced, highly
          verified and continuously monitored by a group of specialists
          in Tanzil Project.

          TERMS OF USE:
          - Permission is granted to copy and distribute verbatim copies
            of this text, but CHANGING THE TEXT IS NOT ALLOWED.
          - This Quran text can be used in any website or application,
            provided that its source (Tanzil Project) is clearly indicated,
            and a link is made to tanzil.net to enable users to keep
            track of changes.
          - This copyright notice shall be included in all verbatim copies
            of the text, and shall be reproduced appropriately in all files
            derived from or containing substantial portion of this text.

          Please check updates at: https://tanzil.net/updates/
          EOF
      - name: Download authentic Madinah Mushaf page scans
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Miftah-Fentaw/Quran-Images.git /tmp/quran-images
          git -C /tmp/quran-images sparse-checkout set png
          mkdir -p app/src/main/assets/mushaf_pages
          cp /tmp/quran-images/png/*.png app/src/main/assets/mushaf_pages/
          test "$(find app/src/main/assets/mushaf_pages -maxdepth 1 -name '*.png' | wc -l)" -eq 604
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/Miftah-Fentaw/Quran-Images/main/LICENSE -o app/src/main/assets/MUSHAF-IMAGES-LICENSE.txt
          cat > app/src/main/assets/MUSHAF-IMAGES-SOURCE.txt <<'EOF'
          Madinah Mushaf page images (604 pages)
          Dataset: Quran Images by Miftah Fentaw
          Repository: https://github.com/Miftah-Fentaw/Quran-Images
          Dataset license: MIT (see MUSHAF-IMAGES-LICENSE.txt)
          Original image source attribution: quran.com-images / Quran-PNG by GovarJabbar.
          These page images are bundled for offline reading and are not altered.
          EOF
          echo "Prepared $(find app/src/main/assets/mushaf_pages -name '*.png' | wc -l) Mushaf pages"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIHRAB-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
