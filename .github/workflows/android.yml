name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Download verified Tanzil Uthmani Quran text
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/acfatah/tanzil/052b515f3a24dfacbe4cafc3b89f0681a447f462/data/quran-uthmani.txt \
            -o app/src/main/assets/quran-uthmani.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("app/src/main/assets/quran-uthmani.txt")
          data = p.read_bytes()
          git_blob_sha = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\\0" + data).hexdigest()
          expected = "f2f03c415ea50f8493d2058ec67a90257333abe3"
          if git_blob_sha != expected:
              raise SystemExit(f"Quran source integrity check failed: {git_blob_sha}")
          print(f"Verified Tanzil Uthmani text: {len(data)} bytes")
          PY
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIHRAB-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
